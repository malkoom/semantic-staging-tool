name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  PROJECT_NAME: SemanticStagingTool

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libasound2-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxrandr-dev

      - name: Configure
        run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-linux --config Release --parallel

      - name: Package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          package_dir="${PROJECT_NAME}-linux-x86_64"
          mkdir -p "$package_dir"
          cp "build-linux/$PROJECT_NAME" "$package_dir/"
          cp -R build-linux/assets build-linux/shaders "$package_dir/"
          cp README.md LICENSE "$package_dir/"
          tar -czf "${package_dir}-${RELEASE_TAG}.tar.gz" "$package_dir"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: SemanticStagingTool-linux-x86_64-*.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Configure
        run: cmake -S . -B build-windows -A x64

      - name: Build
        run: cmake --build build-windows --config Release --parallel

      - name: Package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $packageDir = "$env:PROJECT_NAME-windows-x64"
          New-Item -ItemType Directory -Force $packageDir | Out-Null
          Copy-Item "build-windows/Release/$env:PROJECT_NAME.exe" $packageDir
          Copy-Item build-windows/Release/assets, build-windows/Release/shaders -Destination $packageDir -Recurse
          Copy-Item README.md, LICENSE -Destination $packageDir
          Compress-Archive -Path $packageDir -DestinationPath "$packageDir-$env:RELEASE_TAG.zip"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: SemanticStagingTool-windows-x64-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
